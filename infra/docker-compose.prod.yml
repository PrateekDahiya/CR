# CR Clone — prod compose (Phase 9 hardened, v0.1.0)
#
# Location: infra/docker-compose.prod.yml
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
# Differences vs dev compose:
#   - restart: always on every service (container host / VM expectation).
#   - No bind-mounts for application code; backend receives read-only versioned
#     MySQL schema/seed content so automatic database bootstrap works.
#   - DATABASE_URL + SEASON wired for backend Prisma (Phase 7); memory fallback if unset.
#   - CORS_ORIGIN documented (backend currently CORS * dev-only; set explicit origin in prod).
#   - Healthchecks on postgres/redis/backend/ai-service; frontend depends on backend healthy.
#   - No secrets committed: all via ${VAR:-default} + infra/.env (gitignored).

name: cr-prod

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
      - BACKEND_URL=${BACKEND_URL:-http://backend:4000}
      - NODE_ENV=production
    networks:
      - cr-net
    restart: always

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_URL=${AI_URL:-http://ai-service:8000}
      - POSTGRES_USER=${POSTGRES_USER:-cr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crpass}
      - POSTGRES_DB=${POSTGRES_DB:-crdb}
      - DATABASE_URL=${DATABASE_URL:-postgresql://cr:crpass@postgres:5432/crdb}
      - SEASON=${SEASON:-s1}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - DB_HOST=${DB_HOST:-}
      - DB_USER=${DB_USER:-}
      - DB_PASS=${DB_PASS:-}
      - DB_NAME=${DB_NAME:-cr}
      - DB_PORT=${DB_PORT:-3306}
      - DB_SSL=${DB_SSL:-true}
    volumes:
      - ./mysql:/app/infra/mysql:ro
    networks:
      - cr-net
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_URL=${BACKEND_URL:-http://backend:4000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    networks:
      - cr-net
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crpass}
      POSTGRES_DB: ${POSTGRES_DB:-crdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cr-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cr} -d $${POSTGRES_DB:-crdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cr-net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:

networks:
  cr-net:
    driver: bridge
